server:
  port: 8080

umk3:
  signaling:
    # The Vite dev/preview server proxies /ws, so the browser's Origin is the
    # page's: localhost, or this machine's LAN address in LAN mode (npm run
    # dev:lan, HTTPS). Private IPv4 ranges only; never a public origin.
    allowed-origin-patterns:
      - http://localhost:*
      - https://localhost:*
      - http://127.0.0.1:*
      - https://127.0.0.1:*
      - http://192.168.*.*:*
      - https://192.168.*.*:*
      - http://10.*.*.*:*
      - https://10.*.*.*:*
      - http://172.*.*.*:*
      - https://172.*.*.*:*
      - http://*.local:*
      - https://*.local:*
